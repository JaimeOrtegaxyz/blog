{{define "title"}}{{.Section.Title}}{{end}}
{{define "content"}}
<div class="stream">
{{range .Posts}}<article{{if .HasArt}} class="has-art"{{end}}>
<header class="post-header">
<div>
<h1><a href="{{.URL}}">{{.Title}}</a></h1>
{{if .Summary}}<p class="subtitle">{{.Summary}}</p>{{end}}
<p class="date">{{.DateStr}}</p>
</div>
</header>
<div class="post-body">
{{.HTML}}
</div>
</article>
{{else}}<p class="empty">Nothing here yet.</p>
{{end}}</div>
{{end}}
